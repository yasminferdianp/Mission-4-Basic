<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body
    class="min-h-screen text-gray-800 dark:text-gray-100 transition-colors duration-300 bg-fixed"
    style="
      background-image: url('./bgn.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    "
  >
    <div
      class="min-h-screen flex flex-col items-center justify-start py-8 px-4"
    >
      <header class="w-full max-w-lg flex flex-col items-center mb-6">
        <h1 class="text-6xl text-violet-50 font-bold mb-2">To-Do List</h1>
        <p class="text-xl text-violet-50 dark:text-violet-50 mb-4">
          Kelola tugasmu dengan mudah!
        </p>
      </header>

      <div
        class="bg-stone-900 dark:bg-stone-900 rounded-xl shadow-lg p-4 w-full max-w-lg mb-6"
      >
        <label class="block mb-2 text-sm font-semibold">Nama</label>
        <input
          id="userName"
          type="text"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
          placeholder="Masukkan nama anda"
        />
        <label class="block mt-4 mb-2 text-sm font-semibold">Jabatan</label>
        <input
          id="userRole"
          type="text"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
          placeholder="Masukkan jabatan"
        />
        <button
          id="saveProfile"
          class="mt-4 w-full bg-violet-50 hover:bg-violet-50 text-stone-900 py-2 rounded-lg font-semibold"
        >
          Simpan Profil
        </button>
      </div>
-
      <div
        id="profileSection"
        class="hidden bg-stone-900 dark:bg-stone-900 p-4 rounded-xl shadow w-full max-w-lg mb-6 text-center"
      >
        <h2 class="text-xl font-semibold" id="displayName"></h2>
        <p id="displayRole" class="text-gray-600 dark:text-gray-400"></p>
      </div>

      <div
        class="bg-bg-stone-900 dark:bg-stone-900 p-4 rounded-xl shadow w-full max-w-lg mb-6"
      >
        <label class="block mb-2 text-sm font-semibold" for="date"
          >Waktu Pelaksanaan</label
        >
        <input
          type="date"
          id="date"
          name="date"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
        />

        <label class="block mt-4 mb-2 text-sm font-semibold">Tugas</label>
        <textarea
          id="taskInput"
          rows="2"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
          placeholder="Tulis tugasmu..."
        ></textarea>

        <label class="block mt-4 mb-2 text-sm font-semibold">Prioritas</label>
        <select
          id="prioritySelect"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
        >
          <option value="Low">Low</option>
          <option value="Medium">Medium</option>
          <option value="High">High</option>
        </select>

        <label class="block mt-4 mb-2 text-sm font-semibold"
          >Durasi Pengerjaan (jam)</label
        >
        <input
          id="overdueHours"
          type="number"
          min="1"
          value="24"
          class="w-full p-2 rounded border dark:border-stone-700 bg-stone-700 dark:stone-700"
        />

        <button
          id="addTask"
          class="mt-4 w-full bg-violet-50 hover:bg-violet-50 text-stone-900 py-2 rounded-lg font-semibold"
        >
          Tambah Tugas
        </button>
      </div>

      <div class="w-full max-w-lg grid md:grid-cols-2 gap-4">
        <div class="bg-stone-900 dark:bg-stone-900 p-4 rounded-xl shadow">
          <h3 class="text-lg font-semibold mb-3">To-Do</h3>
          <ul id="todoList" class="space-y-2"></ul>
        </div>

        <div class="bg-stone-900 dark:bg-stone-900 p-4 rounded-xl shadow">
          <h3 class="text-lg font-semibold mb-3">Selesai</h3>
          <ul id="doneList" class="space-y-2"></ul>
        </div>
      </div>

      <button
        id="deleteAll"
        class="mt-8 bg-red-500 hover:bg-red-600 text-red py-2 px-6 rounded-lg font-semibold"
      >
        Hapus Semua
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
